name: annotation
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.9
  - liftoff       # Includes pysam, networkx, numpy, and minimap2 automatically
  - minimap2      # Explicitly listing it ensures you get the version you expect
  - gffread
  - pandas
  - matplotlib
  - numpy
  - networkx
  - pip           # Keep pip in case you add other pure-python tools later