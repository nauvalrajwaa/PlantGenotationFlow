# =============================================================================
# PLANT GENOTATION FLOW CONFIGURATION
# =============================================================================

# -----------------------------------------------------------------------------
# 1. INPUT DATA
# -----------------------------------------------------------------------------
# File yang berisi daftar sampel yang akan diproses.
# Format TAB separated value: sample_id [tab] path/to/reads
samples: "config/samples.tsv"

# -----------------------------------------------------------------------------
# 2. REFERENCE FILES
# -----------------------------------------------------------------------------
# Path relative atau absolute ke file referensi yang dibutuhkan pipeline
refs:
  genome:  "/data/6.PANEL_EXPERTS/wikoaw/Penugasan_YSDS/data/external/Durio_Reference/musangking/GCF_002303985.1_Duzib1.0_genomic.fna"        # Referensi genom spesies dekat (untuk Liftoff)
  gff:     "/data/6.PANEL_EXPERTS/wikoaw/Penugasan_YSDS/data/external/Durio_Reference/musangking/GCF_002303985.1_Duzib1.0_genomic.gff"         # File GFF3 dari referensi genom
  protein: "/data/6.PANEL_EXPERTS/wikoaw/Penugasan_YSDS/data/external/Durio_Reference/musangking/GCF_002303985.1_Duzib1.0_protein.faa"  # Sekuens protein referensi (untuk Galba/Homology)
  cds:     "/data/6.PANEL_EXPERTS/wikoaw/Penugasan_YSDS/data/external/Durio_Reference/musangking/GCF_002303985.1_Duzib1.0_cds_from_genomic.fna"      # Coding Sequences referensi (Optional)

# -----------------------------------------------------------------------------
# 3. ANNOTATION SETTINGS
# -----------------------------------------------------------------------------
annotation:
  # Pilih metode anotasi struktural gen:
  #   - "liftoff" : Hanya Liftoff (DNA-based, transfer dari referensi)
  #   - "galba"   : Hanya GALBA (Protein-based, ab initio dengan Augustus)
  #   - "both"    : Menjalankan keduanya (Liftoff + GALBA)
  # GALBA otomatis menggunakan soft-masked genome dari repeat masking yang dipilih.
  method: "galba"

# -----------------------------------------------------------------------------
# 4. REPEAT MASKING
# -----------------------------------------------------------------------------
# Pilih metode repeat masking:
#   - "edta"    : EDTA pipeline (de novo + curated library, all-in-one)
#   - "tetools" : Double-Layer RepeatModeler + RepeatMasker via TEtools container
#                 Layer 1 = RepeatModeler de novo library → RepeatMasker
#                 Layer 2 = Curated TE library → RepeatMasker
repeats:
  method: "tetools"  # Pilih: "edta" atau "tetools"

  # --- EDTA-specific settings ---
  # Spesies untuk EDTA. Opsi: "Rice", "Maize", atau "others" untuk tumbuhan lain.
  species: "others"

# --- TEtools-specific settings (Double-Layer RepeatMasker) ---
# Digunakan hanya jika repeats.method = "tetools"
tetools:
  # Spesies target untuk RepeatMasker Dfam database (jika diperlukan)
  species: "viridiplantae"
  
  # Jumlah CPU thread untuk RepeatModeler/RepeatMasker container
  threads: 64
  # Path ke curated TE library untuk Layer 2 masking.
  # Jika kosong/terhapus, pipeline akan fallback ke resources/TE_Library_Prep/final_curated_lib.fa
  te_lib: "resources/TE_Library_Prep/final_curated_lib.fa"

# -----------------------------------------------------------------------------
# 5. ASSEMBLY & POLISHING PARAMETERS
# -----------------------------------------------------------------------------
assembly:
  # Pilih assembler: "flye" atau "hifiasm"
  method: "flye"
  
  # Parameter Flye
  flye:
    mode: "--nano-hq"      # Mode assembler (Flye). Gunakan --nano-hq untuk Guppy5+
    genome_size: "400m"    # Estimasi ukuran genom (contoh: 400m, 1g, 50k)

  # Parameter Hifiasm
  # Output file akan berupa .gfa, perlu dikonversi ke fasta
  hifiasm:
    # Mode hifiasm. Gunakan "--ont" untuk Oxford Nanopore R10+ reads.
    # Kosongkan untuk PacBio HiFi default.
    extra_args: "--ont" 
    
    # Hifiasm menghasilkan primary contigs (p_ctg) dan alternate (a_ctg).
    # Pipeline ini akan mengambil p_ctg sebagai output utama.

medaka:
  model: "r941_min_hac_g507" # Model neural network Medaka untuk polishing

# -----------------------------------------------------------------------------
# 6. QUALITY CONTROL (BUSCO)
# -----------------------------------------------------------------------------
busco:
  # Lineage dataset BUSCO untuk evaluasi kelengkapan assembly/anotasi.
  # List lineage bisa dilihat dengan `busco --list-datasets`.
  # Contoh: "embryophyta_odb10", "poales_odb10", "solanales_odb10"
  lineage: "embryophyta_odb10"